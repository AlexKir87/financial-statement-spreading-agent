[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]   # S = security rules (flake8-bandit)

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]                  # asserts are fine in tests

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "evals", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[[tool.mypy.overrides]]
module = ["xlsxwriter", "xlsxwriter.*"]   # XlsxWriter ships no type hints and no stubs package exists
ignore_missing_imports = true
