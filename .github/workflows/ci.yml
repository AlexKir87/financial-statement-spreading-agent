name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: LibreOffice (every workbook is recalculated and verified)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q
      - name: Offline evals (scripted replies, no key)
        run: bash scripts/demo.sh
